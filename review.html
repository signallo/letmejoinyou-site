<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Weekly Review</title>
<style>
:root{--bg:#ffffff;--fg:#000000;--muted:#555555;--rule:#888888;--link:#0000ee;--visited:#551a8b;--note:#f2f2f2;
  --flag:#fff1a8;--flag-rule:#c9a400;--ok:#e3f4e1;--ok-rule:#3b8a33;--drop:#f6e0e0;--drop-rule:#a33;--bad:#c00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111111;--fg:#e8e8e8;--muted:#a8a8a8;--rule:#666666;--link:#8ab4ff;--visited:#c9a0ff;--note:#222222;
  --flag:#3d3300;--flag-rule:#b89a00;--ok:#16301a;--ok-rule:#5fb85a;--drop:#3a1818;--drop-rule:#e07070;--bad:#ff7070;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111111;--fg:#e8e8e8;--muted:#a8a8a8;--rule:#666666;--link:#8ab4ff;--visited:#c9a0ff;--note:#222222;
  --flag:#3d3300;--flag-rule:#b89a00;--ok:#16301a;--ok-rule:#5fb85a;--drop:#3a1818;--drop-rule:#e07070;--bad:#ff7070;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Times New Roman",Times,Georgia,serif;font-size:18px;line-height:1.45}
.page{max-width:820px;margin:0 auto;padding:24px 16px 120px}
a{color:var(--link)} a:visited{color:var(--visited)}
header{text-align:center}
h1{font-size:34px;font-weight:normal;margin:8px 0 2px}
.sub{font-style:italic;margin:0 0 4px}
hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
h2{font-size:26px;font-weight:normal;margin:28px 0 6px}
.day{margin:26px 0 6px;font-size:21px;font-weight:bold;border-bottom:1px solid var(--rule)}
.muted,.where{color:var(--muted)}
.small{font-size:15px}
.note{color:var(--muted);font-size:15px}
.vague{color:var(--bad);margin-top:4px}
nav.jump{text-align:center;font-size:16px;line-height:1.9}
select,input,button,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg)}
input,select,textarea{border:1px solid var(--rule);padding:4px 6px;max-width:100%}
textarea{width:100%;min-height:3.2em}
button{border:1px solid var(--fg);padding:5px 14px;cursor:pointer}
button.on{background:var(--fg);color:var(--bg)}
.table-wrap{overflow-x:auto}
table.stats{border-collapse:collapse;font-size:15px;width:100%}
table.stats th,table.stats td{padding:3px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.stats th:first-child,table.stats td:first-child{text-align:left;white-space:normal}
table.stats tr.all td{font-weight:bold}
.item{border-top:1px solid var(--rule);padding:12px 0 14px}
.item.approve{background:var(--ok);box-shadow:-8px 0 0 var(--ok),8px 0 0 var(--ok)}
.item.drop,.item.skip{background:var(--drop);box-shadow:-8px 0 0 var(--drop),8px 0 0 var(--drop)}
.item.drop .fields,.item.skip .fields{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.head .acts{display:flex;gap:6px}
.title-in{font-size:20px;width:100%;font-weight:bold}
.f{margin:6px 0}
.f label.l{display:inline-block;min-width:5.2em;color:var(--muted);font-size:15px}
.f.flag{background:var(--flag);border-left:4px solid var(--flag-rule);padding:4px 8px;margin-left:-12px}
.f .msg{font-size:15px;margin-top:2px}
.f .printed{font-size:15px;color:var(--muted)}
.f .sug{font-size:15px}
.bad{border-color:var(--bad)!important;outline:1px solid var(--bad)}
.err{color:var(--bad);font-size:15px}
input.t{width:7em} input.dt{width:10.5em} input.ds{width:22em} input.v{width:26em}
.part{border-left:3px solid var(--rule);padding-left:10px;margin:8px 0}
.q{border-top:1px solid var(--rule);padding:12px 0}
.q .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.q .two{grid-template-columns:1fr} input.ds,input.v{width:100%}}
.q .side{font-size:16px}
.vrow{border-top:1px solid var(--rule);padding:8px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--note);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .msg{white-space:pre-line;max-height:9em;overflow:auto;width:100%}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.token{background:var(--note);padding:12px;margin:12px 0}
.token input{width:100%}
details>summary{cursor:pointer}
</style>
</head>
<body>
<div class="page">
<header>
  <h1>Let Me Join You</h1>
  <p class="sub">Weekly review</p>
</header>
<hr>
<main id="main"><p class="center">Loading…</p></main>
</div>
<div class="bar" id="bar" hidden><div class="in"><div class="msg err" id="msg" hidden></div><span id="barText"></span><span><button id="saveBtn">Save and publish</button></span></div></div>
<!--EMBED-->
<script>
"use strict";
// Where the review data lives and where answers go. The page reads and writes
// with a GitHub token Mick pastes once; it is kept only in this browser.
const REPO = "signallo/letmejoinyou", BRANCH = "data", WORKFLOW = "rebuild.yml";
const API = `https://api.github.com/repos/${REPO}`;
const main = document.getElementById("main");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const shortDay = s => s ? pd(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}) : "";
const md = s => { const d = pd(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const tmShow = t => !t ? "" : (t === "none" ? "none" : t.replace(/^0/,"").replace(/(AM|PM)$/," $1"));
const FLAG_NAMES = {venue:"Venue", title:"Title", event_type:"Kind", audience:"For", date_start:"Date",
  date_end:"Ends", dates:"Dates", start_time:"Starts", end_time:"Ends at", category:"Category"};

let R = null;          // review.json
let A = {items:{}, questions:{}, venues:{}};   // answers in progress
const draftKey = () => `lmjy-review-${R.week}`;
const saveDraft = () => { store.set(draftKey(), JSON.stringify(A)); bar(); };
function say(text){ const m = document.getElementById("msg"); m.textContent = text || ""; m.hidden = !text; }

// ------------------------------------------------------------------ loading
async function gh(path, opts = {}){
  const token = store.get("lmjy-token");
  const r = await fetch(API + path, {...opts, headers: {"Accept":"application/vnd.github.raw+json",
    "Authorization": `Bearer ${token}`, "X-GitHub-Api-Version":"2022-11-28", ...(opts.headers||{})}});
  if (!r.ok) throw new Error(`${r.status} ${r.statusText} for ${path}`);
  return r;
}
function tokenForm(msg){
  main.innerHTML = `<div class="token"><p>${msg ? `<span class="err">${esc(msg)}</span><br>` : ""}
    Paste your GitHub token (the fine-grained one for the two Let Me Join You repos). It stays in this browser only.</p>
    <input type="password" id="tok" autocomplete="off" placeholder="github_pat_…">
    <p><button id="tokSave">Save token</button></p></div>`;
  document.getElementById("tokSave").onclick = () => {
    const v = document.getElementById("tok").value.trim();
    if (v){ store.set("lmjy-token", v); load(); }
  };
}
async function load(){
  const embedded = document.getElementById("embedded");
  if (embedded){ R = JSON.parse(embedded.textContent); return start(); }
  if (!store.get("lmjy-token")) return tokenForm();
  try {
    const latest = await (await gh(`/contents/latest.json?ref=${BRANCH}`)).json();
    R = await (await gh(`/contents/runs/${latest.week}/review.json?ref=${BRANCH}`)).json();
  } catch(e){ return tokenForm(`Couldn't load the review: ${e.message}`); }
  start();
}
function start(){
  try { const d = JSON.parse(store.get(draftKey()) || "null"); if (d && d.items) A = d; } catch(e){}
  render();
}

// ------------------------------------------------------------------ numbers
function stats(){
  // Each week's numbers are the ones the Monday run recorded, before any
  // review: what resolved on its own that week. Later rebuilds don't change
  // them. "Waiting now" is what is still left for you after your answers.
  const weeks = [...new Set(R.history.map(r => r.week))].sort().slice(-6);
  if (!weeks.includes(R.week)) weeks.push(R.week);
  const by = {};
  for (const r of R.history) (by[r.source] ||= {})[r.week] = r;
  const now = Object.fromEntries(R.now.map(r => [r.source, r]));
  for (const s of Object.keys(now)) (by[s] ||= {});
  const rec = s => by[s][R.week] || now[s];   // a week the Monday run didn't record: the current numbers
  const pct = (a,b) => b ? Math.round(100*a/b) + "%" : "–";
  const sources = Object.keys(by).sort((a,b) => (a==="All"?-1:b==="All"?1:0) ||
    ((rec(b)||{}).z||0) - ((rec(a)||{}).z||0) || a.localeCompare(b));
  let h = `<div class="table-wrap"><table class="stats"><thead><tr><th>Source</th>
    <th title="Listings read and kept this week">All events</th><th title="Published on their own, before any review">Auto resolved</th>
    <th title="Needed you this week">Manual review</th><th title="Venues the map matched on its own">Venues</th>
    <th title="Still waiting for you after your answers">Waiting now</th>`;
  for (const w of weeks.slice(0,-1)) h += `<th title="Auto resolved, week of ${w}">${md(w)}</th>`;
  h += `</tr></thead><tbody>`;
  for (const s of sources){
    const n = rec(s), left = now[s];
    h += `<tr class="${s==="All"?"all":""}"><td>${esc(s)}</td>`;
    h += n ? `<td>${n.x}</td><td>${n.y} <span class="muted">${pct(n.y,n.x)}</span></td><td>${n.z}</td><td>${pct(n.venue_matched,n.x)}</td>`
           : `<td colspan="4" class="muted">not read this week</td>`;
    h += `<td>${left ? left.z : ""}</td>`;
    for (const w of weeks.slice(0,-1)){ const r = by[s][w]; h += `<td title="${r?`${r.y} of ${r.x} auto resolved, venues ${pct(r.venue_matched,r.x)}`:""}">${r ? pct(r.y,r.x) : ""}</td>`; }
    h += `</tr>`;
  }
  return h + `</tbody></table></div><p class="note">All events, Auto resolved, Manual review, and Venues are the numbers from this week's Monday run, before any review; they stay as they were all week. Waiting now is what is still left for you. The columns on the right are the auto resolved share in earlier weeks.</p>`;
}

// ------------------------------------------------------------------ questions
function sideHtml(v, label){
  const dates = v.is_recurring ? `${esc(v.recurrence_text || "")} (${(v.dates||[]).slice(0,4).map(shortDay).join(", ")}${(v.dates||[]).length>4?"…":""})`
    : esc(shortDay((v.dates||[])[0] || "")) + (v.date_end ? " to " + esc(shortDay(v.date_end)) : "");
  const pr = (v.printed||[]).map(p => `<div class="where small">${esc(p.parish)}${p.week?` (${esc(p.week)})`:""}: “${esc(p.title)}” · ${esc(p.date_text||"")} ${esc(p.start_time_text||"")} · ${esc(p.location_text||"")}${p.url?` · <a href="${esc(p.url)}" target="_blank" rel="noopener">bulletin</a>`:""}</div>`).join("");
  return `<div class="side"><b>${label}: ${esc(v.title)}</b><br>${dates}<br>${v.start_time?esc(tmShow(v.start_time)):'<span class="where">No time listed</span>'}${v.end_time?" to "+esc(tmShow(v.end_time)):""}<br><span class="where">${esc(v.venue||"")}</span>${pr}</div>`;
}
function questions(){
  if (!R.questions.length) return `<p class="muted">None this week.</p>`;
  return R.questions.map(q => {
    const a = A.questions[q.qid] || {};
    const timeQ = q.times_differ ? `<div class="f" ${a.same===true?"":"hidden"} data-tq="${q.qid}">Which time is right?
      <label><input type="radio" name="t-${q.qid}" value="a" ${a.time==="a"?"checked":""}> ${esc(tmShow(q.a.start_time))}</label>
      <label><input type="radio" name="t-${q.qid}" value="b" ${a.time==="b"?"checked":""}> ${esc(tmShow(q.b.start_time))}</label></div>` : "";
    return `<div class="q" data-q="${q.qid}"><div class="muted small">${q.kind === "last week" ? "This week's listing and last week's event" : "Two listings this week"}</div>
      <div class="two">${sideHtml(q.a, q.kind==="last week"?"This week":"A")}${sideHtml(q.b, q.kind==="last week"?"Last week":"B")}</div>
      <p class="row"><button data-qa="same" class="${a.same===true?"on":""}">Same event</button><button data-qa="diff" class="${a.same===false?"on":""}">Different events</button></p>${timeQ}</div>`;
  }).join("");
}

// ------------------------------------------------------------------ listings
const isVP = it => it.kind === "vp";
function original(it){
  return {title: it.title || "", description: it.description || "",
    event_type: it.event_type || "", audience: it.audience || "", category: it.category || "",
    date_start: it.date_start || "", date_end: it.date_end || "",
    dates: (it.dates || []).map(md).join(", "),
    start_time: tmShow(it.start_time), end_time: tmShow(it.end_time),
    venue: it.venue_id ? {mode:"map", id: it.venue_id} : {mode:"map", id:""}};
}
function seriesish(it){ return it.is_recurring || "dates" in it.flags; }
function prefilled(it){
  // What the boxes start with: the reading, then each suggestion for a
  // flagged field on top.
  const v = original(it), s = it.suggest || {};
  for (const [f, x] of Object.entries(s)){
    if (f === "venue"){
      if (x.venue_id === "not-a-place") v.venue = {mode:"none"};
      else if (x.venue_id) v.venue = {mode:"map", id:x.venue_id};
      else if (x.new) v.venue = {mode:"new", name:x.new.name, address:x.new.address};
      v.scope = x.scope;
    } else if (x.value != null){
      v[f] = f === "dates" ? x.value.map(md).join(", ") : x.value;
    }
  }
  if (!v.scope) v.scope = isVP(it) ? "all" : "bulletin";
  return v;
}
const state = it => (A.items[it.lid] ||= {action:null, v: prefilled(it), parts:null});
const venueLabel = id => { const v = VENUES[id]; return v ? `${v.name} — ${v.address}` : ""; };
let VENUES = {}, VENUE_BY_LABEL = {};

function printedFor(it, f){
  const p = it.printed || {};
  const keys = {venue:["location_text","address"], title:["title"], date_start:["date_text"], date_end:["date_text"],
    dates:["recurrence_text","date_text"], start_time:["start_time_text","date_text","recurrence_text"],
    end_time:["end_time_text","start_time_text"], event_type:["title"], audience:["title"], category:["title"]}[f] || [];
  const parts = keys.map(k => p[k]).filter(Boolean);
  return parts.length ? `Printed: “${esc([...new Set(parts)].join(" · "))}”` : "Printed: nothing";
}
function fieldWrap(it, f, label, inner){
  const flag = it.flags[f];
  const s = (it.suggest || {})[f];
  let extra = "";
  if (flag){
    extra += `<div class="msg">${esc(flag)}</div><div class="printed">${printedFor(it, f)}</div>`;
    if (s) extra += `<div class="sug">${s.value != null || s.venue_id || s.new ? "Suggested" : "No suggestion"}${s.why ? ": " + esc(s.why) : ""}${s.from==="model"?" (Claude)":""}</div>`;
  }
  return `<div class="f${flag ? " flag" : ""}" data-f="${f}"><label class="l">${esc(label)}</label> ${inner}${extra}</div>`;
}
function venueInner(v, idp){
  const m = v.mode || "map";
  return `<select data-k="${idp}mode"><option value="map" ${m==="map"?"selected":""}>Venue in the map</option>
      <option value="new" ${m==="new"?"selected":""}>New venue</option><option value="none" ${m==="none"?"selected":""}>Not a place (drop)</option></select>
    ${m==="map" ? `<input class="v" list="venues" data-k="${idp}id" value="${esc(venueLabel(v.id))}" placeholder="Type to search the map">` : ""}
    ${m==="new" ? `<br><input class="v" data-k="${idp}name" value="${esc(v.name||"")}" placeholder="Venue name"> <input class="v" data-k="${idp}address" value="${esc(v.address||"")}" placeholder="Street, Town, PA 15xxx">` : ""}`;
}
function itemHtml(it){
  const st = state(it), v = st.v, vp = isVP(it);
  const types = vp ? R.categories : R.event_types;
  const typeField = vp ? "category" : "event_type";
  let h = `<div class="item ${st.action||""}" data-lid="${it.lid}">
    <div class="head"><span class="muted small">${esc(it.source)}${it.part?` · part ${esc(it.part)}`:""}${it.link?` · <a href="${esc(it.link)}" target="_blank" rel="noopener">${vp?"listing":"bulletin"}</a>`:""}</span>
    <span class="acts"><button data-act="approve" class="${st.action==="approve"?"on":""}">Approve</button><button data-act="drop" class="${st.action==="drop"?"on":""}" title="Never publish this listing again">Drop</button><button data-act="skip" class="${st.action==="skip"?"on":""}" title="Leave it out of this week only">Skip this week</button></span></div>
    <div class="fields">`;
  const firstDay = (it.dates||[])[0] || it.date_start;
  h += `<div class="small">${firstDay ? `<b>${esc(shortDay(firstDay))}</b>` : `<span class="where">no date read</span>`}${(it.dates||[]).length > 1 ? ` <span class="where">and ${it.dates.length-1} more</span>` : ""}
    · ${it.start_time ? esc(tmShow(it.start_time)) : `<span class="where">No time listed</span>`}
    · <span class="where">${it.location_venue ? esc(it.location_venue) : "no venue matched: “" + esc((it.printed||{}).location_text || "") + "”"}</span></div>`;
  h += fieldWrap(it, "title", "Title", `<input class="title-in" data-k="title" value="${esc(v.title)}">`);
  if (!st.parts){
    const range = isVP(it) && it.date_end && !(it.dates||[]).length;
    if (seriesish(it)) h += fieldWrap(it, "dates", "Dates", `<input class="ds" data-k="dates" value="${esc(v.dates)}" placeholder="10/12, 10/19, 10/26"> <span class="note">${range ? `Range ${esc(md(it.date_start))} to ${esc(md(it.date_end))}. Leave empty and Approve to keep the whole range.` : esc(it.recurrence_text||"")}</span>`);
    else h += fieldWrap(it, "date_start", "Date", `<input type="date" class="dt" data-k="date_start" value="${esc(v.date_start)}"> to <input type="date" class="dt" data-k="date_end" value="${esc(v.date_end)}">${it.dates_note?`<div class="note">${esc(it.dates_note)}</div>`:""}`);
    h += `<div class="row">` + fieldWrap(it, "start_time", "Starts", `<input class="t" data-k="start_time" value="${esc(v.start_time)}" placeholder="7:00 PM">`)
       + fieldWrap(it, "end_time", "Ends", `<input class="t" data-k="end_time" value="${esc(v.end_time)}" placeholder="none">`) + `</div>`;
    h += fieldWrap(it, "venue", "Venue", venueInner(v.venue, "venue.") +
      `<div class="small">Save this wording for: <label><input type="radio" name="sc-${it.lid}" data-k="scope" value="bulletin" ${v.scope!=="all"?"checked":""}> Only this pull source</label>
       <label><input type="radio" name="sc-${it.lid}" data-k="scope" value="all" ${v.scope==="all"?"checked":""}> All pull sources</label></div>` + vagueNote((it.suggest||{}).vague));
  } else {
    h += st.parts.map((p, n) => `<div class="part" data-part="${n}"><b>Part ${n+1}</b> <button data-act="rmpart">Remove</button>
      <div class="f"><label class="l">Venue</label> ${venueInner(p.venue, `parts.${n}.venue.`)}</div>
      <div class="f"><label class="l">Dates</label> <input class="ds" data-k="parts.${n}.dates" value="${esc(p.dates||"")}" placeholder="10/12, 10/26"> or repeats <input data-k="parts.${n}.repeats" value="${esc(p.repeats||"")}" placeholder="second Sunday"></div>
      <div class="row"><div class="f"><label class="l">Starts</label> <input class="t" data-k="parts.${n}.start_time" value="${esc(p.start_time||"")}"></div>
      <div class="f"><label class="l">Ends</label> <input class="t" data-k="parts.${n}.end_time" value="${esc(p.end_time||"")}"></div></div></div>`).join("")
      + `<p><button data-act="addpart">Add a part</button> <button data-act="unsplit">Don't split</button></p>`;
  }
  h += `<div class="row">` + fieldWrap(it, typeField, vp ? "Category" : "Kind",
      `<select data-k="${typeField}"><option value=""></option>${types.map(t => `<option ${v[typeField]===t?"selected":""}>${esc(t)}</option>`).join("")}</select>`)
    + (vp ? "" : fieldWrap(it, "audience", "For", `<select data-k="audience"><option value=""></option>${R.audiences.map(t => `<option ${v.audience===t?"selected":""}>${esc(t)}</option>`).join("")}</select>`))
    + `</div>`;
  h += fieldWrap(it, "description", "About", `<textarea data-k="description">${esc(v.description)}</textarea>`);
  if (!st.parts && !vp) h += `<p class="small"><button data-act="split">Split into parts</button> <span class="note">one printed listing that is really several events (different places or schedules)</span></p>`;
  if (it.auto_rules && it.auto_rules.length) h += `<div class="note">Read by rule: ${esc(it.auto_rules.join("; "))}</div>`;
  return h + `<div class="err" data-err></div></div></div>`;
}
function listings(){
  // Visit Pittsburgh listings whose only question is the venue are answered
  // in the venue list; listings held only by a same-event question wait for it.
  const items = R.items.filter(it => Object.keys(it.flags).length &&
    !(isVP(it) && Object.keys(it.flags).length === 1 && it.flags.venue));
  if (!items.length) return `<p class="muted">None this week.</p>`;
  const bySource = {};
  for (const it of items) (bySource[it.source] ||= []).push(it);
  const order = Object.keys(bySource).sort((a,b) => bySource[b].length - bySource[a].length || a.localeCompare(b));
  return order.map(s => `<div class="day">${esc(s)} <span class="muted small">${bySource[s].length}</span></div>` +
    bySource[s].sort((a,b) => a.title.localeCompare(b.title)).map(itemHtml).join("")).join("");
}

// ------------------------------------------------------------------ VP venues
// Answers about a place are kept by its printed name and address, so an
// unsaved answer never lands on a different place after a rebuild.
const placeKey = v => `${v.wording}|${v.address}`;
// Claude's note when a printed place looks too vague to save as a wording.
// Only a note: the choice stays Mick's.
function vagueNote(g){
  if (!g || !g.verdict || g.verdict === "ok") return "";
  const head = g.verdict === "too_vague" ? "Claude: this wording looks too vague to save"
                                         : "Claude: fine for this pull source only, too vague for all pull sources";
  return `<div class="small vague">${head}${g.why ? " — " + esc(g.why) : ""}</div>`;
}

function vpVenues(){
  if (!R.vp_venues.length) return `<p class="muted">None this week.</p>`;
  const rows = R.vp_venues.map((v, n) => {
    const vk = placeKey(v);
    const a = A.venues[vk] || (A.venues[vk] = {on:false, v: v.suggest && v.suggest.venue_id ? {mode:"map", id:v.suggest.venue_id}
      : {mode:"new", name: (v.suggest && v.suggest.new && v.suggest.new.name) || v.wording, address: (v.suggest && v.suggest.new && v.suggest.new.address) || v.address},
      scope: (v.suggest && v.suggest.scope) || "all"});
    return `<div class="vrow" data-vn="${n}"><label><input type="checkbox" data-k="on" ${a.on?"checked":""}> <b>${esc(v.wording)}</b></label>
      <span class="where small">${(v.other_wordings||[]).length ? `also printed as ${esc(v.other_wordings.join("; "))} (not saved) · ` : ""}${esc(v.address)} · ${v.lids.length} event${v.lids.length>1?"s":""}: ${esc(v.titles.join("; "))}</span>
      <div class="f">${venueInner(a.v, "v.")}</div>
      <div class="small">Save this wording for: <label><input type="radio" name="vs-${n}" data-k="scope" value="bulletin" ${a.scope!=="all"?"checked":""}> Only this pull source</label>
      <label><input type="radio" name="vs-${n}" data-k="scope" value="all" ${a.scope==="all"?"checked":""}> All pull sources</label></div>${vagueNote(v.vague)}</div>`;
  }).join("");
  return `<p class="small"><button id="vpAll">Check all</button> <button id="vpNone">Uncheck all</button>
    <span class="note">Each checked place goes into the map. Its street address then matches for every source.</span></p>${rows}`;
}

// ------------------------------------------------------------------ page
function render(){
  VENUES = Object.fromEntries(R.venues.map(v => [v.id, v]));
  VENUE_BY_LABEL = Object.fromEntries(R.venues.map(v => [`${v.name} — ${v.address}`, v.id]));
  const nItems = R.items.filter(it => Object.keys(it.flags).length && !(isVP(it) && Object.keys(it.flags).length===1 && it.flags.venue)).length;
  main.innerHTML = `<p class="center">Week of ${esc(shortDay(R.week))} · built ${esc((R.built_at||"").replace("T"," "))} · ${R.published} events published</p>
    <nav class="jump"><a href="#numbers">Numbers</a> · <a href="#questions">Same event? (${R.questions.length})</a> ·
      <a href="#listings">Listings (${nItems})</a> · <a href="#vp">Visit Pittsburgh places (${R.vp_venues.length})</a></nav>
    <h2 id="numbers">This week's numbers</h2>${stats()}
    <h2 id="questions">Same event?</h2><p class="note">Until you answer, neither listing is published (last week's event stays up meanwhile).</p>${questions()}
    <h2 id="listings">Listings to check</h2><p class="note">Highlighted boxes need you. They are filled in with a suggestion where there is one; the printed text is underneath. Approve publishes the listing as the boxes show it. Anything you leave alone isn't published this week.</p>${listings()}
    <h2 id="vp">Visit Pittsburgh places</h2>${vpVenues()}
    <datalist id="venues">${R.venues.map(v => `<option value="${esc(v.name + " — " + v.address)}">`).join("")}</datalist>
    <p class="note center"><a href="#" id="forget">Forget my token on this browser</a> · <a href="#" id="clearDraft">Start over (clear unsaved answers)</a></p>`;
  bar();
}
function setPath(obj, path, val){
  const ks = path.split("."); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = (o[ks[i]] ||= (/^\d+$/.test(ks[i+1]) ? [] : {}));
  o[ks[ks.length-1]] = val;
}
function itemOf(el){ const d = el.closest("[data-lid]"); return d && R.items.find(i => i.lid === d.dataset.lid); }
function rerenderItem(it){
  const old = main.querySelector(`[data-lid="${it.lid}"]`);
  const t = document.createElement("div"); t.innerHTML = itemHtml(it); old.replaceWith(t.firstElementChild);
}
main.addEventListener("input", e => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  const it = itemOf(el);
  const val = el.type === "checkbox" ? el.checked : el.value;
  if (it){
    const st = state(it);
    const target = k.startsWith("parts.") ? st : st.v;
    if (k.endsWith(".id")) setPath(target, k, VENUE_BY_LABEL[val] || "");
    else if (k.startsWith("parts.")) setPath(st, k, val);
    else setPath(st.v, k, val);
    if (k.endsWith("mode")) rerenderItem(it);
  }
  const vr = el.closest("[data-vn]");
  if (vr){
    const a = A.venues[placeKey(R.vp_venues[vr.dataset.vn])];
    if (k === "on") a.on = el.checked; else if (k === "scope") a.scope = val;
    else if (k.endsWith(".id")) a.v.id = VENUE_BY_LABEL[val] || ""; else setPath(a, k, val);
    if (k.endsWith("mode")){ const n = vr.dataset.vn; const t = document.createElement("div"); t.innerHTML = vpVenues(); vr.replaceWith(t.querySelector(`[data-vn="${n}"]`)); }
  }
  saveDraft();
});
main.addEventListener("click", e => {
  const b = e.target.closest("button,a#forget,a#clearDraft"); if (!b) return;
  if (b.id === "forget"){ e.preventDefault(); store.del("lmjy-token"); location.reload(); return; }
  if (b.id === "clearDraft"){ e.preventDefault();
    if (b.dataset.sure){ store.del(draftKey()); A = {items:{},questions:{},venues:{}}; render(); }
    else { b.dataset.sure = "1"; b.textContent = "Click again to clear every answer you haven't saved"; }
    return; }
  if (b.id === "vpAll" || b.id === "vpNone"){ for (const k of Object.keys(A.venues)) A.venues[k].on = b.id === "vpAll"; render(); location.hash = "#vp"; saveDraft(); return; }
  const qd = b.closest("[data-q]");
  if (qd && b.dataset.qa){
    const a = A.questions[qd.dataset.q] ||= {};
    a.same = b.dataset.qa === "same" ? (a.same === true ? undefined : true) : (a.same === false ? undefined : false);
    const t = document.createElement("div"); t.innerHTML = questions();
    qd.replaceWith(t.querySelector(`[data-q="${qd.dataset.q}"]`)); saveDraft(); return;
  }
  const it = itemOf(b); if (!it) return;
  const st = state(it), act = b.dataset.act;
  if (act === "approve" || act === "drop" || act === "skip") st.action = st.action === act ? null : act;
  if (act === "split") st.parts = [{venue:{mode:"map",id:it.venue_id||""}}, {venue:{mode:"map",id:""}}];
  if (act === "addpart") st.parts.push({venue:{mode:"map",id:""}});
  if (act === "rmpart"){ st.parts.splice(+b.closest("[data-part]").dataset.part, 1); if (st.parts.length < 2) st.parts = null; }
  if (act === "unsplit") st.parts = null;
  rerenderItem(it); saveDraft();
});
document.addEventListener("change", e => {
  if (e.target.type === "radio" && e.target.name.startsWith("t-")){
    (A.questions[e.target.name.slice(2)] ||= {}).time = e.target.value; saveDraft();
  }
});

// ------------------------------------------------------------------ answers
const TIME_RE = /^(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m?\.?$/i;
function readTime(s){
  s = (s || "").trim(); if (!s || /^none$/i.test(s)) return "none";
  const m = s.match(TIME_RE); if (!m || +m[1] < 1 || +m[1] > 12 || +(m[2]||0) > 59) return null;
  return `${+m[1]}:${m[2]||"00"} ${m[3].toUpperCase()}M`;
}
function readDates(s){
  const out = [];
  const year = +R.week.slice(0,4), wk = pd(R.week);
  for (const p of (s||"").split(/[,;]+/).map(x => x.trim()).filter(Boolean)){
    let m = p.match(/^(\d{4})-(\d{2})-(\d{2})$/), d;
    if (m) d = new Date(+m[1], +m[2]-1, +m[3]);
    else if ((m = p.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/))){
      let y = m[3] ? +(m[3].length === 2 ? "20"+m[3] : m[3]) : year;
      d = new Date(y, +m[1]-1, +m[2]);
      if (!m[3] && d < new Date(wk.getTime() - 60*864e5)) d = new Date(y+1, +m[1]-1, +m[2]);
    }
    if (!d || isNaN(d)) return null;
    out.push(iso(d));
  }
  return [...new Set(out)].sort();
}
function venueChoice(v, errs, what){
  if (!v) return null;
  if (v.mode === "none") return {venue_id:"not-a-place"};
  if (v.mode === "new"){
    if (!(v.name||"").trim() || !/\b\d{5}\b/.test(v.address||"")) { errs.push(`${what}: a new venue needs a name and an address with a zip`); return null; }
    return {new:{name:v.name.trim(), address:v.address.trim()}};
  }
  return v.id ? {venue_id:v.id} : null;
}
function collect(){
  const errs = [], items = [];
  for (const it of R.items){
    const st = A.items[it.lid]; if (!st || !st.action) continue;
    const base = {lid:it.lid, key:it.key, source:it.source, kind:it.kind, printed:it.printed, action:st.action};
    if (st.action === "drop"){ items.push({...base, drop_reason:"dropped on review"}); continue; }
    if (st.action === "skip"){ items.push(base); continue; }
    const v = st.v, o = original(it), fields = {}, bad = [];
    const flagged = f => f in it.flags;
    const changed = f => v[f] !== o[f];
    for (const f of ["title","description","event_type","audience","category"])
      if ((flagged(f) || changed(f)) && v[f]) fields[f] = v[f];
    if (!st.parts){
      if (seriesish(it)){
        const keepRange = isVP(it) && it.date_end && !(it.dates||[]).length && !(v.dates||"").trim();
        if ((flagged("dates") || changed("dates")) && !keepRange){ const d = readDates(v.dates); if (!d || !d.length) bad.push("dates"); else fields.recurrence_dates = d; }
      } else {
        if ((flagged("date_start") || changed("date_start"))){ if (!v.date_start) bad.push("date_start"); else fields.date_start = v.date_start; }
        if (changed("date_end") && v.date_end) fields.date_end = v.date_end;
      }
      for (const f of ["start_time","end_time"]){
        if (flagged(f) || changed(f)){ const t = readTime(v[f]); if (t === null) bad.push(f); else fields[f] = t; }
      }
    }
    const out = {...base, fields, scope: v.scope};
    if (!st.parts && (flagged("venue") || v.venue.mode !== "map" || v.venue.id !== o.venue.id)){
      const c = venueChoice(v.venue, errs, it.title);
      if (!c && flagged("venue")) bad.push("venue"); else if (c) out.venue = c;
    }
    if (st.parts){
      out.split = st.parts.map((p, n) => {
        const c = venueChoice(p.venue, errs, `${it.title} part ${n+1}`); if (!c) bad.push(`part ${n+1} venue`);
        const part = {venue:c};
        if (p.dates){ const d = readDates(p.dates); if (!d) bad.push(`part ${n+1} dates`); else part.recurrence_dates = d; }
        if (p.repeats) part.repeats = p.repeats;
        for (const f of ["start_time","end_time"]) if (p[f]){ const t = readTime(p[f]); if (t === null) bad.push(`part ${n+1} ${f}`); else part[f] = t; }
        return part;
      });
    }
    if (bad.length) errs.push(`${it.title} (${it.source}): check ${bad.map(f => FLAG_NAMES[f] || f).join(", ")}`);
    items.push(out);
  }
  const same = [];
  for (const q of R.questions){
    const a = A.questions[q.qid]; if (!a || a.same === undefined) continue;
    if (a.same && q.times_differ && !a.time){ errs.push(`Same event? ${q.a.title}: pick which time is right`); continue; }
    same.push({a:q.key_a, b:q.key_b, same:a.same, time_from: a.same && a.time ? (a.time === "a" ? q.key_a : q.key_b) : ""});
  }
  const venues = [];
  R.vp_venues.forEach((v, n) => {
    const a = A.venues[placeKey(v)]; if (!a || !a.on) return;
    const c = venueChoice(a.v, errs, v.wording); if (!c){ errs.push(`${v.wording}: pick or enter the venue`); return; }
    venues.push({source:v.source, wording:v.wording, other_wordings:v.other_wordings||[], venue:c, scope:a.scope});
  });
  return {errs, answers:{saved_at:new Date().toISOString(), week:R.week, items, same, venues}};
}
function bar(){
  const {answers} = collect();
  const n = answers.items.length + answers.same.length + answers.venues.length;
  document.getElementById("bar").hidden = false;
  document.getElementById("barText").textContent = n ? `${answers.items.length} listings, ${answers.same.length} questions, ${answers.venues.length} places ready` : "Nothing answered yet";
}
function b64(s){ const b = new TextEncoder().encode(s); let x = ""; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); }
document.getElementById("saveBtn").onclick = async () => {
  const {errs, answers} = collect();
  for (const el of main.querySelectorAll("[data-err]")) el.textContent = "";
  if (errs.length){ say("Fix these first:\n" + errs.join("\n")); return; }
  if (!answers.items.length && !answers.same.length && !answers.venues.length){ say("Nothing to save yet."); return; }
  say("");
  if (document.getElementById("embedded")){
    say(`This is a preview, so nothing was saved. On the real page this would save ${answers.items.length} listings, ${answers.same.length} questions and ${answers.venues.length} places, then rebuild the site.`);
    return;
  }
  const btn = document.getElementById("saveBtn"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    const name = answers.saved_at.replace(/[:.]/g, "-");
    await gh(`/contents/inbox/${name}.json`, {method:"PUT", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:`Review answers ${R.week}`, branch:BRANCH, content:b64(JSON.stringify(answers, null, 1))})});
    store.del(draftKey());
    try {
      await gh(`/actions/workflows/${WORKFLOW}/dispatches`, {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ref:"main"})});
    } catch(e){
      main.innerHTML = `<p>Your answers are saved. The rebuild didn't start (${esc(e.message)}): the token needs "Actions: Read and write" on letmejoinyou.
        Start it from the <a href="https://github.com/${REPO}/actions/workflows/${WORKFLOW}" target="_blank" rel="noopener">Actions tab</a> (Run workflow), or it runs with next Monday's build.</p>`;
      document.getElementById("bar").hidden = true;
      return;
    }
    main.innerHTML = `<p>Saved. The site is rebuilding with your answers; it takes a few minutes.
      <a href="https://github.com/${REPO}/actions" target="_blank" rel="noopener">Watch it run</a>.
      When it finishes, reload this page to see what's left.</p>`;
    document.getElementById("bar").hidden = true;
  } catch(e){
    say(`Couldn't save: ${e.message}. Your answers are still here; nothing was lost.`);
  }
  btn.disabled = false; btn.textContent = "Save and publish";
};
load();
</script>
</body>
